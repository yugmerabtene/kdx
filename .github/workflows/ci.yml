name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nasm shellcheck

      - name: Lint scripts
        run: shellcheck build.sh test.sh
         
      - name: Build compiler
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kdx-binary
          path: kdx

  smoke-tests:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Run smoke tests
        run: ./test.sh
