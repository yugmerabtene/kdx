name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm
        
      - name: Build compiler
        run: ./build.sh
          
      - name: Run tests
        run: ./test.sh
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kdx-binary
          path: kdx
